[package]
name = "aqmonitor"
version = "0.1.0"
edition = "2024"
description = "LAN-only air quality API backed by the WAQI service, built to run on a Raspberry Pi 4"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
strip = true
panic = "abort"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
